[project]
name = "ai-news-bot"
version = "0.1.0"
description = "A CrewAI-powered news research, summarization, Slack, and Google Sheets automation bot."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]>=0.175.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "requests>=2.32.0",
    "groq>=0.30.0",
    "langchain-groq>=1.1.0",
    "google-api-python-client>=2.170.0",
    "google-auth>=2.40.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
